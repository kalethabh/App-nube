<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050505" />
    <!-- el ícono de Kads Studio (el mismo del menú, componentes/Logo.jsx). Nombre nuevo para que el navegador no muestre el viejo guardado -->
    <link rel="icon" type="image/svg+xml" href="/kads-icono.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/kads-icono-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/kads-icono-180.png" />
    <title>Kads Studio by Kalethabh</title>
    <script>
      /* el tema (datos/tema.js) antes de pintar, para que no parpadee */
      (function () {
        var t = 'oscuro';
        try {
          var v = localStorage.getItem('kads:tema');
          if (v === 'claro' || v === 'oscuro') t = v;
          else if (v === 'auto' && window.matchMedia('(prefers-color-scheme: light)').matches) t = 'claro';
        } catch (e) {}
        document.documentElement.setAttribute('data-tema', t);
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
